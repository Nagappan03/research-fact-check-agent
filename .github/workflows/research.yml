name: Research Agent

# Three ways in:
#   1. schedule - the real long-term automation. Runs unattended, weekdays at
#      9 PM IST (15:30 UTC), with no human or agent involved at trigger time.
#      A schedule event carries no input, so the topic comes from the repo
#      itself: pick-next-topic.js reads topics.json (this agent's pipeline)
#      and cost-log.csv (what's already been researched) and picks the next
#      one. See that script's header comment for how to keep topics.json in
#      sync with the blog's own pipeline.
#   2. workflow_dispatch - manual trigger from the Actions tab, topic typed in
#      (for researching something out of pipeline order, or re-running one).
#   3. push to .trigger/topic.txt - an older automated path (a Claude session
#      writing the topic and pushing it) that's no longer relied on day to
#      day now that `schedule` covers it, but is left in place since it
#      still works and is a reasonable manual/scripted fallback.
#      (workflow_dispatch can't be called by an unattended Claude session -
#      the credential those sessions get lacks the actions:write permission,
#      confirmed by testing directly - which is the whole reason paths 1 and
#      3 exist instead of just calling workflow_dispatch on a timer.)
on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to research (e.g. Vector Databases & Embeddings)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".trigger/topic.txt"

# Needed so the "Commit cost log" step below can push cost-log.csv back to
# the repo. Runners are ephemeral - without committing it, cumulative cost
# would reset to zero on every run.
permissions:
  contents: write

jobs:
  research-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Determine topic
        id: topic
        # workflow_dispatch carries the topic as a typed input; a push carries
        # it as the file content that was just committed; schedule carries
        # nothing, so pick-next-topic.js works it out from the repo.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TOPIC="${{ inputs.topic }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if TOPIC="$(node pick-next-topic.js)"; then
              : # picked the next un-researched topic
            else
              echo "Nothing left in topics.json to research - skipping this scheduled run."
              echo "has_topic=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            TOPIC="$(cat .trigger/topic.txt)"
          fi
          if [ -z "$TOPIC" ]; then
            echo "No topic found (empty input or empty .trigger/topic.txt)." >&2
            exit 1
          fi
          echo "has_topic=true" >> "$GITHUB_OUTPUT"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"

      - name: Run research agent
        if: steps.topic.outputs.has_topic == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node research.js "${{ steps.topic.outputs.topic }}"

      - name: Commit cost log
        if: steps.topic.outputs.has_topic == 'true'
        # cost-log.csv is gitignored for local runs, but the runner's
        # filesystem is thrown away after the job, so this run's cost would
        # otherwise never accumulate into the next one. Commit it back to
        # the repo so the next checkout starts from the real running total.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cost-log.csv
          if git diff --staged --quiet; then
            echo "cost-log.csv unchanged, nothing to commit"
          else
            git commit -m "Update cost-log.csv [skip ci]"
            git push
          fi

      - name: Email the brief
        if: steps.topic.outputs.has_topic == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Only set on a schedule run (pick-next-topic.js reports it); blank
          # on workflow_dispatch/push, where send-brief-email.js just skips
          # the low-queue warning since there's nothing to warn about there.
          QUEUE_REMAINING: ${{ steps.topic.outputs.remaining }}
        run: node send-brief-email.js "${{ steps.topic.outputs.topic }}"

      - name: Notify empty topic queue
        # Only reachable via the schedule path - workflow_dispatch/push with
        # an empty topic fail the "Determine topic" step outright instead.
        if: steps.topic.outputs.has_topic == 'false'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node notify-empty-queue.js
