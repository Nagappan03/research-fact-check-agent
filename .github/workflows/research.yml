name: Research Agent

# Two ways in:
#   1. workflow_dispatch - manual trigger from the Actions tab, topic typed in.
#   2. push to .trigger/topic.txt - the automated path. A scheduled agent
#      writes the next pipeline topic into that file and pushes it; GitHub's
#      own push event fires this workflow, no Actions REST API call needed.
#      (workflow_dispatch can't be called by an automated agent session here -
#      the credential those sessions get lacks the actions:write permission,
#      confirmed by testing directly - but a plain git push isn't gated by
#      that same permission, so this is the trigger that can actually run
#      unattended.)
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to research (e.g. Vector Databases & Embeddings)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".trigger/topic.txt"

# Needed so the "Commit cost log" step below can push cost-log.csv back to
# the repo. Runners are ephemeral - without committing it, cumulative cost
# would reset to zero on every run.
permissions:
  contents: write

jobs:
  research-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Determine topic
        id: topic
        # workflow_dispatch carries the topic as a typed input; a push carries
        # it as the file content that was just committed.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TOPIC="${{ inputs.topic }}"
          else
            TOPIC="$(cat .trigger/topic.txt)"
          fi
          if [ -z "$TOPIC" ]; then
            echo "No topic found (empty input or empty .trigger/topic.txt)." >&2
            exit 1
          fi
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"

      - name: Run research agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node research.js "${{ steps.topic.outputs.topic }}"

      - name: Commit cost log
        # cost-log.csv is gitignored for local runs, but the runner's
        # filesystem is thrown away after the job, so this run's cost would
        # otherwise never accumulate into the next one. Commit it back to
        # the repo so the next checkout starts from the real running total.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cost-log.csv
          if git diff --staged --quiet; then
            echo "cost-log.csv unchanged, nothing to commit"
          else
            git commit -m "Update cost-log.csv [skip ci]"
            git push
          fi

      - name: Email the brief
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node send-brief-email.js "${{ steps.topic.outputs.topic }}"
